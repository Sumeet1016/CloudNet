server:
  port: 8080

spring:
  application:
    name: cloudnest-backend

  datasource:
    url: jdbc:mysql://localhost:3306/cloudnest_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: '@Sumeet16'
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# JWT settings
app:
  jwt:
    secret: cloudnest-super-secret-key-change-this-in-production-please-2026
    expiration-ms: 86400000   # 24 hours

  # Local folders used to simulate storage providers (swap with real SDKs later)
  storage:
    local-disk-path: ./storage/local-disk
    simulated-s3-path: ./storage/simulated-s3
    temp-path: ./storage/temp

  # Google Drive OAuth (fill these in with your own credentials from Google Cloud Console)
  google:
    client-id: YOUR_GOOGLE_CLIENT_ID
    client-secret: YOUR_GOOGLE_CLIENT_SECRET
    redirect-uri: http://localhost:8080/api/cloud-providers/google/callback
    application-name: CloudNest

  # AES encryption key for backed-up files (32 chars = AES-256). Change in production.
  encryption:
    secret-key: cloudnest2026aes256secretkey!!!!

logging:
  level:
    com.cloudnest: DEBUG

server:
  port: 8080

spring:
  application:
    name: cloudnest-backend

  datasource:
    url: jdbc:mysql://localhost:3306/cloudnest_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: '@Sumeet16'
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

app:
  jwt:
    secret: cloudnest-super-secret-key-change-this-in-production-please-2026
    expiration-ms: 86400000

  storage:
    local-disk-path: ./storage/local-disk
    simulated-s3-path: ./storage/simulated-s3
    temp-path: ./storage/temp

  google:
    client-id: YOUR_GOOGLE_CLIENT_ID
    client-secret: YOUR_GOOGLE_CLIENT_SECRET
    redirect-uri: http://localhost:8080/api/cloud-providers/google/callback
    application-name: CloudNest

  backblaze:
    endpoint: https://s3.us-west-004.backblazeb2.com
    region: us-west-004
    access-key-id: ''
    secret-access-key: ''
    bucket-name: cloudnest-backups

  # Hardcoded quotas per provider (bytes) + alert thresholds.
  quotas:
    google-drive-bytes: 16106127360
    local-disk-bytes: 4194304 
    simulated-s3-bytes: 5368709120
    backblaze-bytes: 10737418240
    warning-threshold: 0.80
    critical-threshold: 0.95

  encryption:
    secret-key: cloudnest2026aes256secret!!!!!

logging:
  level:
    com.cloudnest: DEBUG